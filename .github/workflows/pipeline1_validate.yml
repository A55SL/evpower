name: "Pipeline 1 — Validate Charger"

on:
  repository_dispatch:
    types: [validate-charger]

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      CHARGER_ID:   ${{ github.event.client_payload.charger_id }}
      MANUFACTURE:  ${{ github.event.client_payload.manufacture }}
      MODEL_NAME:   ${{ github.event.client_payload.model_name }}
      OCPP_VARIANT: ${{ github.event.client_payload.ocpp_variant }}
      FIRMWARE_VER: ${{ github.event.client_payload.firmware_ver }}
      RETRY_COUNT:  ${{ github.event.client_payload.retry_count }}

    steps:
      - name: Print received payload
        run: |
          echo "============================================"
          echo " EV Charger Telemetry — Validation Check"
          echo "============================================"
          echo "  Charger ID   : $CHARGER_ID"
          echo "  Manufacturer : $MANUFACTURE"
          echo "  Model        : $MODEL_NAME"
          echo "  OCPP Variant : $OCPP_VARIANT"
          echo "  Firmware     : $FIRMWARE_VER"
          echo "  Retry Count  : $RETRY_COUNT"
          echo "============================================"

      - name: Install packaging library
        run: pip install packaging --quiet

      - name: Run validation rules
        id: validate
        run: |
          python3 - <<'PYEOF'
          import sys, os
          from packaging.version import Version, InvalidVersion

          ocpp_variant = os.environ["OCPP_VARIANT"]
          firmware_raw = os.environ["FIRMWARE_VER"]
          firmware_ver = firmware_raw.lstrip("v")

          errors = []

          # Rule 1: OCPP variant must be exactly one of the two accepted values
          valid_ocpp = ["OCPP-1.6J", "OCPP-2.0.1"]
          if ocpp_variant not in valid_ocpp:
              errors.append(
                  f"ocpp_variant '{ocpp_variant}' is invalid — must be one of {valid_ocpp}"
              )

          # Rule 2: firmware version must be >= v2.0.0
          try:
              if Version(firmware_ver) < Version("2.0.0"):
                  errors.append(
                      f"firmware_ver '{firmware_raw}' is below minimum v2.0.0"
                  )
          except InvalidVersion as exc:
              errors.append(f"Cannot parse firmware_ver '{firmware_raw}': {exc}")

          github_output = os.environ.get("GITHUB_OUTPUT", "")

          if errors:
              print("VALIDATION FAILED:")
              for err in errors:
                  print(f"  ✗ {err}")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write("validation_passed=false\n")
          else:
              print("VALIDATION PASSED:")
              print(f"  ✓ ocpp_variant  : {ocpp_variant}")
              print(f"  ✓ firmware_ver  : {firmware_raw} >= v2.0.0")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write("validation_passed=true\n")
          PYEOF

      # ── Failure path ──────────────────────────────────────────────────────────

      - name: Check retry limit before triggering OTA
        if: steps.validate.outputs.validation_passed == 'false'
        run: |
          if [ "$RETRY_COUNT" -ge 3 ]; then
            echo "ERROR: Maximum retry limit (3) reached for charger '$CHARGER_ID'."
            echo "       Manual inspection required. Aborting OTA loop."
            exit 1
          fi
          echo "Retry count ($RETRY_COUNT) is within limit. Triggering OTA update pipeline..."

      - name: Trigger Pipeline 2 (OTA Update)
        if: steps.validate.outputs.validation_passed == 'false'
        run: |
          NEXT_RETRY=$(( RETRY_COUNT + 1 ))
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "$(jq -n \
              --arg charger_id   "$CHARGER_ID" \
              --arg manufacture  "$MANUFACTURE" \
              --arg model_name   "$MODEL_NAME" \
              --arg ocpp_variant "$OCPP_VARIANT" \
              --arg firmware_ver "$FIRMWARE_VER" \
              --argjson retry    "$NEXT_RETRY" \
              '{
                event_type: "ota-update",
                client_payload: {
                  charger_id:   $charger_id,
                  manufacture:  $manufacture,
                  model_name:   $model_name,
                  ocpp_variant: $ocpp_variant,
                  firmware_ver: $firmware_ver,
                  retry_count:  $retry
                }
              }')")
          echo "GitHub dispatch HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "WARNING: Dispatch returned unexpected status $HTTP_STATUS"
          else
            echo "Pipeline 2 (OTA Update) triggered successfully (retry attempt $NEXT_RETRY)."
          fi

      # ── Success path ──────────────────────────────────────────────────────────

      - name: Charger validated — ready for CSMS
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          echo "============================================"
          echo " Charger '$CHARGER_ID' is VALIDATED"
          echo " and ready for CSMS connection."
          echo "  OCPP Variant : $OCPP_VARIANT"
          echo "  Firmware     : $FIRMWARE_VER"
          echo "============================================"
