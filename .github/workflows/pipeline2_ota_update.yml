name: "Pipeline 2 — OTA Firmware Update"

on:
  repository_dispatch:
    types: [ota-update]

jobs:
  ota-update:
    runs-on: ubuntu-latest

    env:
      CHARGER_ID:      ${{ github.event.client_payload.charger_id }}
      MANUFACTURE:     ${{ github.event.client_payload.manufacture }}
      MODEL_NAME:      ${{ github.event.client_payload.model_name }}
      OCPP_VARIANT:    ${{ github.event.client_payload.ocpp_variant }}
      FIRMWARE_VER:    ${{ github.event.client_payload.firmware_ver }}
      RETRY_COUNT:     ${{ github.event.client_payload.retry_count }}
      TARGET_FIRMWARE: "v2.0.0"

    steps:
      - name: Print OTA request details
        run: |
          echo "============================================"
          echo " OTA Firmware Update Initiated"
          echo "============================================"
          echo "  Charger ID       : $CHARGER_ID"
          echo "  Manufacturer     : $MANUFACTURE"
          echo "  Model            : $MODEL_NAME"
          echo "  Current firmware : $FIRMWARE_VER"
          echo "  Target firmware  : $TARGET_FIRMWARE"
          echo "  Retry count      : $RETRY_COUNT"
          echo "============================================"

      - name: Simulate OTA API call
        run: |
          echo "Pushing OTA update request to charger '$CHARGER_ID'..."
          RESPONSE=$(curl -s -X POST https://httpbin.org/post \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg charger_id      "$CHARGER_ID" \
              --arg manufacture     "$MANUFACTURE" \
              --arg model_name      "$MODEL_NAME" \
              --arg current_fw      "$FIRMWARE_VER" \
              --arg target_fw       "$TARGET_FIRMWARE" \
              '{
                charger_id:       $charger_id,
                manufacture:      $manufacture,
                model_name:       $model_name,
                current_firmware: $current_fw,
                target_firmware:  $target_fw,
                action:           "ota_update"
              }')")
          echo "OTA API response:"
          echo "$RESPONSE" | jq '.json // .'
          echo "OTA push complete — charger '$CHARGER_ID' is being updated to $TARGET_FIRMWARE."

      - name: Re-trigger Pipeline 1 with updated firmware
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "$(jq -n \
              --arg charger_id   "$CHARGER_ID" \
              --arg manufacture  "$MANUFACTURE" \
              --arg model_name   "$MODEL_NAME" \
              --arg ocpp_variant "$OCPP_VARIANT" \
              --arg target_fw    "$TARGET_FIRMWARE" \
              --argjson retry    "$RETRY_COUNT" \
              '{
                event_type: "validate-charger",
                client_payload: {
                  charger_id:   $charger_id,
                  manufacture:  $manufacture,
                  model_name:   $model_name,
                  ocpp_variant: $ocpp_variant,
                  firmware_ver: $target_fw,
                  retry_count:  $retry
                }
              }')")
          echo "GitHub dispatch HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "WARNING: Dispatch returned unexpected status $HTTP_STATUS"
          else
            echo "Pipeline 1 re-triggered with firmware=$TARGET_FIRMWARE (retry_count=$RETRY_COUNT)."
          fi
