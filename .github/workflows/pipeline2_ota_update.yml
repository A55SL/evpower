name: "Pipeline 2 — OTA Firmware Update"

on:
  repository_dispatch:
    types: [ota-update]

jobs:
  ota-update:
    runs-on: ubuntu-latest

    env:
      CHARGER_ID:      ${{ github.event.client_payload.charger_id }}
      MANUFACTURE:     ${{ github.event.client_payload.manufacture }}
      MODEL_NAME:      ${{ github.event.client_payload.model_name }}
      OCPP_VARIANT:    ${{ github.event.client_payload.ocpp_variant }}
      FIRMWARE_VER:    ${{ github.event.client_payload.firmware_ver }}
      RETRY_COUNT:     ${{ github.event.client_payload.retry_count }}

    steps:
      - name: Fetch latest firmware package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching latest firmware release..."
          LATEST_TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --json tagName \
            --jq '[.[] | select(.tagName | startswith("firmware-"))] | first | .tagName')

          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No firmware releases found. Run Pipeline 3 first to build a firmware package."
            exit 1
          fi

          echo "Latest firmware release: $LATEST_TAG"
          mkdir -p /tmp/firmware
          gh release download "$LATEST_TAG" \
            --pattern "firmware.json" \
            --dir /tmp/firmware \
            --repo "${{ github.repository }}"

          TARGET_FIRMWARE=$(jq -r '.version' /tmp/firmware/firmware.json)
          echo "Fetched firmware version: $TARGET_FIRMWARE"
          echo "TARGET_FIRMWARE=$TARGET_FIRMWARE" >> "$GITHUB_ENV"

          echo "Firmware package contents:"
          cat /tmp/firmware/firmware.json

      - name: Print OTA request details
        run: |
          echo "============================================"
          echo " OTA Firmware Update Initiated"
          echo "============================================"
          echo "  Charger ID       : $CHARGER_ID"
          echo "  Manufacturer     : $MANUFACTURE"
          echo "  Model            : $MODEL_NAME"
          echo "  Current firmware : $FIRMWARE_VER"
          echo "  Target firmware  : $TARGET_FIRMWARE"
          echo "  Retry count      : $RETRY_COUNT"
          echo "============================================"

      - name: Simulate OTA API call
        run: |
          echo "Pushing OTA update request to charger '$CHARGER_ID'..."
          RESPONSE=$(curl -s -X POST https://httpbin.org/post \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg charger_id      "$CHARGER_ID" \
              --arg manufacture     "$MANUFACTURE" \
              --arg model_name      "$MODEL_NAME" \
              --arg current_fw      "$FIRMWARE_VER" \
              --arg target_fw       "$TARGET_FIRMWARE" \
              '{
                charger_id:       $charger_id,
                manufacture:      $manufacture,
                model_name:       $model_name,
                current_firmware: $current_fw,
                target_firmware:  $target_fw,
                action:           "ota_update"
              }')")
          echo "OTA API response:"
          echo "$RESPONSE" | jq '.json // .'
          echo "OTA push complete — charger '$CHARGER_ID' is being updated to $TARGET_FIRMWARE."

      - name: Callback to receiver with updated firmware
        run: |
          if [ -z "${{ secrets.RECEIVER_URL }}" ]; then
            echo "RECEIVER_URL secret not set — skipping callback. Postman status will not update."
          else
            echo "Sending firmware update callback to receiver..."
            HTTP_STATUS=$(curl -s -o /tmp/cb_response.json -w "%{http_code}" \
              -X PATCH \
              "${{ secrets.RECEIVER_URL }}/charger/$CHARGER_ID/firmware" \
              -H "Content-Type: application/json" \
              -d "{\"firmware_ver\": \"$TARGET_FIRMWARE\"}")
            echo "Callback HTTP status: $HTTP_STATUS"
            cat /tmp/cb_response.json
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Receiver state updated — Postman can now see firmware_ver=$TARGET_FIRMWARE."
            else
              echo "WARNING: Callback returned $HTTP_STATUS — receiver state may not have updated."
            fi
          fi

      - name: Update Postman environment variable
        continue-on-error: true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_ENV_ID:  ${{ secrets.POSTMAN_ENV_ID }}
        run: |
          if [ -z "$POSTMAN_API_KEY" ] || [ -z "$POSTMAN_ENV_ID" ]; then
            echo "POSTMAN_API_KEY or POSTMAN_ENV_ID not set — skipping Postman update."
            exit 0
          fi
          python3 - <<'PYEOF'
          import os, json
          from urllib import request
          from urllib.error import HTTPError

          api_key  = os.environ["POSTMAN_API_KEY"]
          env_id   = os.environ["POSTMAN_ENV_ID"]
          new_fw   = os.environ["TARGET_FIRMWARE"]
          base_url = f"https://api.getpostman.com/environments/{env_id}"
          headers  = {"X-Api-Key": api_key, "Content-Type": "application/json"}

          try:
              req = request.Request(base_url, headers=headers)
              with request.urlopen(req) as resp:
                  env = json.loads(resp.read())
          except HTTPError as e:
              if e.code == 401:
                  print("ERROR 401: POSTMAN_API_KEY is invalid or expired.")
              elif e.code == 404:
                  print(f"ERROR 404: Environment ID '{env_id}' not found.")
                  print("  Check your POSTMAN_ENV_ID secret — it should be the ID")
                  print("  after /environment/ in your Postman workspace URL.")
              else:
                  print(f"ERROR {e.code}: {e.reason}")
              raise SystemExit(1)

          values = env["environment"]["values"]
          found = False
          for v in values:
              if v["key"] == "firmware_ver":
                  print(f"Updating firmware_ver: {v['value']} → {new_fw}")
                  v["value"] = new_fw
                  found = True
                  break
          if not found:
              values.append({"key": "firmware_ver", "value": new_fw, "enabled": True})
              print(f"firmware_ver not found — adding it with value {new_fw}")

          body = json.dumps({"environment": {"values": values}}).encode()
          req = request.Request(base_url, data=body, headers=headers, method="PUT")
          try:
              with request.urlopen(req) as resp:
                  result = json.loads(resp.read())
              print(f"Postman environment '{result['environment']['name']}' updated.")
              print(f"firmware_ver is now: {new_fw}")
              print(f"Next Send in Postman will use firmware_ver = {new_fw}.")
          except HTTPError as e:
              print(f"ERROR updating environment: {e.code} {e.reason}")
              raise SystemExit(1)
          PYEOF

      - name: Re-trigger Pipeline 1 with updated firmware
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "$(jq -n \
              --arg charger_id   "$CHARGER_ID" \
              --arg manufacture  "$MANUFACTURE" \
              --arg model_name   "$MODEL_NAME" \
              --arg ocpp_variant "$OCPP_VARIANT" \
              --arg target_fw    "$TARGET_FIRMWARE" \
              --argjson retry    "$RETRY_COUNT" \
              '{
                event_type: "validate-charger",
                client_payload: {
                  charger_id:   $charger_id,
                  manufacture:  $manufacture,
                  model_name:   $model_name,
                  ocpp_variant: $ocpp_variant,
                  firmware_ver: $target_fw,
                  retry_count:  $retry
                }
              }')")
          echo "GitHub dispatch HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "WARNING: Dispatch returned unexpected status $HTTP_STATUS"
          else
            echo "Pipeline 1 re-triggered with firmware=$TARGET_FIRMWARE (retry_count=$RETRY_COUNT)."
          fi
