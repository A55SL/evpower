name: "Pipeline 3 — Build Firmware"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version to build (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must be in format vX.Y.Z (e.g. v2.0.0)"
            exit 1
          fi
          echo "Building firmware package for version: ${{ github.event.inputs.version }}"

      - name: Generate firmware package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version    "$VERSION" \
            --arg build_date "$BUILD_DATE" \
            '{
              version:          $version,
              build_date:       $build_date,
              compatible_ocpp:  ["OCPP-1.6J", "OCPP-2.0.1"],
              target_models:    ["Terra 54", "CT4000", "Pulsar Plus"],
              release_notes:    "Mandatory minimum version for CSMS compatibility."
            }' > firmware.json

          CHECKSUM=$(sha256sum firmware.json | awk '{print $1}')
          jq --arg checksum "sha256:$CHECKSUM" '. + {checksum: $checksum}' firmware.json > firmware_final.json
          mv firmware_final.json firmware.json

          echo "Generated firmware.json:"
          cat firmware.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="firmware-$VERSION"

          gh release create "$TAG" firmware.json \
            --title "Firmware $VERSION" \
            --notes "$(jq -r '.release_notes' firmware.json)" \
            --repo "${{ github.repository }}"

          echo "============================================"
          echo " Release '$TAG' created."
          echo " firmware.json is now available for OTA."
          echo "============================================"
